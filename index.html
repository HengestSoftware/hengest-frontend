<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HENGEST - Plataforma de registro y control de producción diaria, lotes y alimento para granjas avícolas de huevo comercial.">
    <title>HENGEST | Control de Producción Avícola</title>

    <!-- Tipografía con carácter: Fraunces (titulares) y Manrope (cuerpo y números) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Modo claro por defecto siempre al entrar a HENGEST.
         Solo se activa modo oscuro si el usuario autenticado tiene guardada esa preferencia en su cuenta
         o si la cambió voluntariamente en la pestaña actual. -->
    <script>
      (function() {
        try {
          var userTheme = localStorage.getItem('hengest_user_theme');
          var guestTheme = sessionStorage.getItem('hengest_guest_theme');
          var activeTheme = userTheme || guestTheme || 'light';
          if (activeTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-primary antialiased font-sans selection:bg-emerald-500/30 selection:text-emerald-950 dark:selection:text-emerald-100">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
